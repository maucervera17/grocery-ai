name: GroceryAI
packages:
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    from: 3.4.0
options:
  bundleIdPrefix: com.groceryai
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  GroceryAI:
    type: application
    platform: iOS
    sources:
      - path: GroceryAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groceryai.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: barasu-icon
        INFOPLIST_KEY_CFBundleDisplayName: Barasu
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Barasu usa tu ubicación para encontrar precios cercanos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Barasu usa el micrófono para agregar y modificar productos por voz.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    dependencies:
      - package: ElevenLabs
    scheme:
      testTargets:
        - GroceryAITests
  GroceryAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GroceryAITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GroceryAI

