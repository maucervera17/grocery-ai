name: Integration checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node --check web/app.js
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native savings calculations
        run: |
          swiftc ios/GroceryAI/Domain/Models/*.swift scripts/swift-savings/main.swift -o /tmp/savings-test
          /tmp/savings-test
      - name: Build the integrated iOS app
        run: xcodebuild -project ios/GroceryAI.xcodeproj -scheme GroceryAI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
